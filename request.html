<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetBridge — 훈련 의뢰 등록</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Pretendard',-apple-system,sans-serif;}
    .ps{position:relative;}
    .ps::before{content:'';position:absolute;left:-3px;top:114px;width:3px;height:32px;background:#3a3a3c;border-radius:2px 0 0 2px;box-shadow:0 46px 0 #3a3a3c,0 92px 0 #3a3a3c;}
    .ps::after{content:'';position:absolute;right:-3px;top:160px;width:3px;height:64px;background:#3a3a3c;border-radius:0 2px 2px 0;}
    .phone{width:390px;height:844px;background:#F8FAFC;border-radius:52px;border:11px solid #222;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #3a3a3c,0 50px 100px rgba(0,0,0,.85);transform-origin:top center;position:relative;}
    .sb{flex-shrink:0;height:52px;background:#F8FAFC;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;position:relative;}
    .di{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:18px;}
    .sb-t{font-size:15px;font-weight:700;color:#111827;}
    .sb-i{display:flex;align-items:center;gap:5px;}
    .nav{flex-shrink:0;height:52px;display:flex;align-items:center;padding:0 16px;background:#F8FAFC;border-bottom:1px solid #EBEDF0;position:relative;}
    .back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;text-decoration:none;}
    .nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:700;color:#111827;letter-spacing:-.3px;}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px;}
    .content::-webkit-scrollbar{display:none;}

    /* Pet Profile Card */
    .pet-card{background:#fff;border:1px solid #EBEDF0;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:20px;}
    .pet-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FFE0B8,#FF9A3D);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
    .pet-name{font-size:17px;font-weight:700;color:#111827;letter-spacing:-.3px;margin-bottom:3px;}
    .pet-info{font-size:13px;color:#6B7280;}
    .pet-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
    .pet-tag{padding:3px 10px;background:#FFF4EC;color:#FF7A00;border-radius:100px;font-size:11px;font-weight:600;}

    /* Section */
    .sec-title{font-size:15px;font-weight:700;color:#111827;margin-bottom:12px;margin-top:4px;}
    .field{margin-bottom:16px;}
    .field-label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:8px;}

    /* Segment control */
    .seg{display:flex;background:#F0F1F3;border-radius:10px;padding:3px;gap:3px;margin-bottom:16px;}
    .seg-btn{flex:1;height:38px;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:#6B7280;transition:all .2s;}
    .seg-btn.on{background:#fff;color:#111827;box-shadow:0 1px 4px rgba(0,0,0,.12);}

    /* Chips */
    .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
    .chip{padding:9px 14px;background:#fff;border:1.5px solid #EBEDF0;border-radius:10px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;font-family:inherit;transition:all .15s;}
    .chip.on{background:#FFF4EC;border-color:#FF7A00;color:#FF7A00;font-weight:600;}

    /* Input */
    .field-input{width:100%;height:52px;background:#fff;border:1.5px solid #EBEDF0;border-radius:12px;padding:0 16px;font-size:15px;color:#111827;font-family:inherit;outline:none;transition:border-color .15s;}
    .field-input:focus{border-color:#FF7A00;}
    .field-input::placeholder{color:#AEB4BD;}
    .field-textarea{width:100%;min-height:100px;background:#fff;border:1.5px solid #EBEDF0;border-radius:12px;padding:14px 16px;font-size:14px;color:#111827;font-family:inherit;outline:none;resize:none;line-height:1.6;transition:border-color .15s;}
    .field-textarea:focus{border-color:#FF7A00;}
    .field-textarea::placeholder{color:#AEB4BD;}

    /* Urgent toggle */
    .urgent-wrap{background:#FFF5F5;border:1.5px solid #FECACA;border-radius:12px;margin-bottom:16px;overflow:hidden;}
    .urgent-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:12px;}
    .urgent-title{font-size:14px;font-weight:700;color:#DC2626;margin-bottom:3px;}
    .urgent-desc{font-size:12px;color:#EF4444;line-height:1.5;}
    .toggle-btn{width:46px;height:26px;border-radius:100px;background:#E5E7EB;flex-shrink:0;position:relative;transition:background .2s;cursor:pointer;}
    .toggle-btn.on{background:#DC2626;}
    .toggle-knob{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
    .toggle-btn.on .toggle-knob{left:23px;}

    /* Divider */
    .divider{height:1px;background:#F0F1F3;margin:4px 0 20px;}

    /* Bottom */
    .bottom-cta{flex-shrink:0;padding:12px 20px 28px;background:#F8FAFC;border-top:1px solid #EBEDF0;}
    .btn-p{width:100%;height:56px;background:#FF7A00;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(255,122,0,.3);}
    .btn-p:active{filter:brightness(.88);}

    /* Complete Modal */
    .modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;border-radius:42px;}
    .modal-overlay.show{opacity:1;pointer-events:all;}
    .modal-sheet{background:#fff;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;transform:translateY(40px);transition:transform .3s cubic-bezier(.22,1,.36,1);}
    .modal-overlay.show .modal-sheet{transform:translateY(0);}
    .modal-check{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FF7A00,#FF9A3D);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 6px 18px rgba(255,122,0,.35);}
    .modal-title{font-size:20px;font-weight:800;color:#111827;text-align:center;letter-spacing:-.4px;margin-bottom:12px;}
    .modal-body{font-size:14px;color:#6B7280;line-height:1.75;text-align:center;margin-bottom:28px;word-break:keep-all;}
    .modal-btn{width:100%;height:54px;background:#111827;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;}
  </style>
</head>
<body>
<div class="ps">
  <div class="phone" id="phone">
    <div class="sb">
      <div class="di"></div>
      <span class="sb-t">9:41</span>
      <div class="sb-i">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#111827"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="4.5" y="4" width="3" height="8" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="11" r="1" fill="#111827" stroke="none"/><path d="M5.5 8c1.4-1.4 3.6-1.4 5 0"/><path d="M3 5.5c2.8-2.8 7.2-2.8 10 0"/><path d="M.5 3C4.6-1 11.4-1 15.5 3"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#111827" stroke-opacity=".3"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#111827"/><path d="M24 4.5v4a2 2 0 000-4z" fill="#111827" fill-opacity=".4"/></svg>
      </div>
    </div>
    <div class="nav">
      <a href="diagnosis-result.html" class="back">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"><path d="M8.5 1.5L1.5 8.5l7 7"/></svg>
      </a>
      <span class="nav-title">훈련 의뢰 등록</span>
    </div>

    <div class="content">
      <!-- Pet Card -->
      <div class="pet-card">
        <div class="pet-avatar" id="petAvatar">🐶</div>
        <div style="flex:1">
          <div class="pet-name" id="petName">코코</div>
          <div class="pet-info" id="petInfo">—</div>
          <div class="pet-tags" id="petTags"></div>
        </div>
        <a href="diagnosis.html" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB4BD" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </a>
      </div>

      <!-- Training Method -->
      <div class="sec-title">훈련 방식</div>
      <div class="seg" id="methodSeg">
        <button class="seg-btn on" onclick="selSeg(this,'methodSeg')">방문 훈련</button>
        <button class="seg-btn" onclick="selSeg(this,'methodSeg')">센터 훈련</button>
        <button class="seg-btn" onclick="selSeg(this,'methodSeg')">온라인 훈련</button>
      </div>

      <!-- Duration -->
      <div class="field">
        <label class="field-label">훈련 기간</label>
        <div class="chip-row" id="durationChips">
          <button class="chip" onclick="selChip(this,'durationChips')">2주</button>
          <button class="chip on" onclick="selChip(this,'durationChips')">4주</button>
          <button class="chip" onclick="selChip(this,'durationChips')">8주</button>
          <button class="chip" onclick="selChip(this,'durationChips')">12주+</button>
          <button class="chip" onclick="selChip(this,'durationChips')">자유</button>
        </div>
      </div>

      <!-- Sessions per week -->
      <div class="field">
        <label class="field-label">주 훈련 횟수</label>
        <div class="chip-row" id="sessionChips">
          <button class="chip" onclick="selChip(this,'sessionChips')">주 1회</button>
          <button class="chip on" onclick="selChip(this,'sessionChips')">주 2회</button>
          <button class="chip" onclick="selChip(this,'sessionChips')">주 3회</button>
          <button class="chip" onclick="selChip(this,'sessionChips')">집중반</button>
        </div>
      </div>

      <!-- Budget -->
      <div class="field">
        <label class="field-label">예산 (회당)</label>
        <div class="chip-row" id="budgetChips">
          <button class="chip" onclick="selChip(this,'budgetChips')">3만원대</button>
          <button class="chip on" onclick="selChip(this,'budgetChips')">5만원대</button>
          <button class="chip" onclick="selChip(this,'budgetChips')">7만원대</button>
          <button class="chip" onclick="selChip(this,'budgetChips')">협의 가능</button>
        </div>
      </div>

      <!-- Urgent -->
      <div class="urgent-wrap" id="urgentWrap">
        <div class="urgent-row" onclick="toggleUrgent()">
          <div>
            <div class="urgent-title">⚡ 긴급 요청</div>
            <div class="urgent-desc">긴급 요청 시 추가 수수료 10%가 부가됩니다.</div>
          </div>
          <div class="toggle-btn" id="urgentToggle">
            <div class="toggle-knob"></div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Notes -->
      <div class="field">
        <label class="field-label">훈련 목표 및 특이사항</label>
        <textarea class="field-textarea" placeholder="예: 손님이 오면 심하게 짖어서 이웃에게 민폐가 될까봐 걱정이에요. 최대한 빠른 개선을 원합니다." rows="4"></textarea>
      </div>

      <!-- Address -->
      <div class="field">
        <label class="field-label">주소 (방문 훈련 시)</label>
        <input class="field-input" type="text" placeholder="서울시 마포구 상암동">
      </div>

      <div style="height:8px"></div>
    </div>

    <!-- Complete Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <div class="modal-check">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M6 15l7 7 11-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="modal-title">견적 요청이 완료되었습니다!</div>
        <div class="modal-body">훈련사들이 의뢰 내용을 검토한 후<br>제안서를 보내드릴 예정입니다.<br><br>약 <strong style="color:#FF7A00">2~3일 이내</strong>에 견적을 받아보실 수 있으며,<br>알림으로 안내해 드립니다.</div>
        <button class="modal-btn" onclick="window.location.href='home.html'">확인</button>
      </div>
    </div>

    <div class="bottom-cta">
      <button class="btn-p" onclick="saveAndRequest()">
        견적 요청하기
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>
<script>
  function scale(){const p=document.getElementById('phone');const s=Math.min(1,(window.innerWidth-32)/390,(window.innerHeight-32)/844);p.style.transform=`scale(${s})`;document.body.style.alignItems=s<1?'flex-start':'center';document.body.style.paddingTop=s<1?'16px':'0';}
  scale();window.addEventListener('resize',scale);

  function selSeg(el,id){document.querySelectorAll(`#${id} .seg-btn`).forEach(b=>b.classList.remove('on'));el.classList.add('on');}
  function selChip(el,id){document.querySelectorAll(`#${id} .chip`).forEach(c=>c.classList.remove('on'));el.classList.add('on');}

  function showModal() {
    document.getElementById('modalOverlay').classList.add('show');
  }

  function saveAndRequest() {
    // 훈련 방식
    const methodEl = document.querySelector('#methodSeg .seg-btn.on');
    const method = methodEl ? methodEl.textContent.trim() : '방문 훈련';

    // 훈련 기간
    const durationEl = document.querySelector('#durationChips .chip.on');
    const duration = durationEl ? durationEl.textContent.trim() : '4주';

    // 주 훈련 횟수
    const sessionEl = document.querySelector('#sessionChips .chip.on');
    const session = sessionEl ? sessionEl.textContent.trim() : '주 2회';

    // 예산
    const budgetEl = document.querySelector('#budgetChips .chip.on');
    const budget = budgetEl ? budgetEl.textContent.trim() : '5만원대';

    // 긴급 여부
    localStorage.setItem('pb_method', method);
    localStorage.setItem('pb_duration', duration);
    localStorage.setItem('pb_session', session);
    localStorage.setItem('pb_budget', budget);
    localStorage.setItem('pb_urgent', urgentOn ? 'true' : 'false');

    // 모달 표시 후 이동
    document.getElementById('modalOverlay').classList.add('show');
  }

  // Fill pet info from localStorage
  const dogName   = localStorage.getItem('pb_dogName')    || '코코';
  const dogAge    = localStorage.getItem('pb_dogAge')     || '';
  const dogWeight = localStorage.getItem('pb_dogWeight')  || '';
  const dogTags   = JSON.parse(localStorage.getItem('pb_dogTags') || '[]');

  document.getElementById('petName').textContent = dogName;

  // Build info line
  const infoParts = [];
  if (dogAge)    infoParts.push(dogAge);
  if (dogWeight) infoParts.push(dogWeight + 'kg');
  document.getElementById('petInfo').textContent = infoParts.length ? infoParts.join(' · ') : '정보 없음';

  // Personality tags
  const tagsEl = document.getElementById('petTags');
  dogTags.forEach(t => {
    tagsEl.innerHTML += `<span class="pet-tag">${t}</span>`;
  });

  // Photo preview
  const photoData = localStorage.getItem('pb_photo');
  if (photoData) {
    const av = document.getElementById('petAvatar');
    av.innerHTML = `<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
    av.style.padding = '0';
  }

  // Urgent toggle
  let urgentOn = false;
  function toggleUrgent() {
    urgentOn = !urgentOn;
    document.getElementById('urgentToggle').classList.toggle('on', urgentOn);
  }
</script>
</body>
</html>
