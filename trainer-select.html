<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetBridge — 훈련사 선택 완료</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Pretendard',-apple-system,sans-serif;}
    .ps{position:relative;}
    .ps::before{content:'';position:absolute;left:-3px;top:114px;width:3px;height:32px;background:#3a3a3c;border-radius:2px 0 0 2px;box-shadow:0 46px 0 #3a3a3c,0 92px 0 #3a3a3c;}
    .ps::after{content:'';position:absolute;right:-3px;top:160px;width:3px;height:64px;background:#3a3a3c;border-radius:0 2px 2px 0;}
    .phone{width:390px;height:844px;background:#F8FAFC;border-radius:52px;border:11px solid #222;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #3a3a3c,0 50px 100px rgba(0,0,0,.85);transform-origin:top center;}
    .sb{flex-shrink:0;height:52px;background:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 10px;position:relative;}
    .di{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:18px;}
    .sb-t{font-size:15px;font-weight:700;color:#111827;}
    .sb-i{display:flex;align-items:center;gap:5px;}

    /* Success hero */
    .success-hero{background:#fff;padding:40px 20px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:8px solid #F0F1F3;}
    .check-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FF7A00,#FF9A3D);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 24px rgba(255,122,0,.4);opacity:1;transform:scale(1);}
    .success-title{font-size:24px;font-weight:800;color:#111827;letter-spacing:-.5px;margin-bottom:6px;opacity:1;transform:none;}
    .success-sub{font-size:14px;color:#6B7280;line-height:1.6;opacity:1;transform:none;}
    .check-circle svg path{stroke-dasharray:40;stroke-dashoffset:0;}
    @keyframes popIn{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
    @keyframes drawCheck{from{stroke-dashoffset:40;}to{stroke-dashoffset:0;}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @media(prefers-reduced-motion:no-preference){
      .check-circle{animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) both;}
      .check-circle svg{animation:drawCheck .4s .3s ease both;}
      .check-circle svg path{stroke-dasharray:40;stroke-dashoffset:40;}
      .success-title{animation:fadeUp .4s .4s ease both;}
      .success-sub{animation:fadeUp .4s .5s ease both;}
    }

    /* Scroll */
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .content::-webkit-scrollbar{display:none;}

    /* Trainer profile card */
    .trainer-card{margin:16px;background:#fff;border:1px solid #EBEDF0;border-radius:14px;overflow:hidden;}
    .trainer-card-top{background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;display:flex;align-items:center;gap:14px;}
    .trainer-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4);}
    .trainer-name-w .t-name{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.3px;margin-bottom:3px;}
    .trainer-name-w .t-title{font-size:13px;color:rgba(255,255,255,.8);}
    .t-rating-row{display:flex;align-items:center;gap:4px;margin-top:4px;}
    .t-rating-row span{font-size:13px;color:#fff;font-weight:700;}
    .trainer-card-body{padding:16px;}
    .info-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F4F5F7;}
    .info-row:last-child{border-bottom:none;}
    .info-label{font-size:13px;color:#6B7280;flex-shrink:0;width:80px;}
    .info-val{font-size:14px;font-weight:600;color:#111827;}
    .info-orange{color:#FF7A00;}

    /* Chat screen */
    .chat-screen{position:absolute;inset:0;background:#F8FAFC;z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);border-radius:42px;}
    .chat-screen.show{transform:translateX(0);}
    .ch-nav{flex-shrink:0;background:#fff;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #EBEDF0;}
    .ch-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
    .ch-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
    .ch-nm{font-size:15px;font-weight:700;color:#111827;}
    .ch-st{font-size:11px;color:#10B981;}
    .chat-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
    .chat-msgs::-webkit-scrollbar{display:none;}
    .datelbl{text-align:center;font-size:11px;color:#AEB4BD;margin:2px 0 6px;}
    .msg{display:flex;gap:7px;align-items:flex-end;}
    .msg.me{flex-direction:row-reverse;}
    .msg-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;}
    .bbl{max-width:210px;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.55;word-break:keep-all;}
    .msg:not(.me) .bbl{background:#fff;color:#111827;border-radius:4px 18px 18px 18px;border:1px solid #EBEDF0;}
    .msg.me .bbl{background:#FF7A00;color:#fff;border-radius:18px 4px 18px 18px;}
    .mt{font-size:10px;color:#C9CDD4;flex-shrink:0;margin-bottom:2px;}
    .chat-bar{flex-shrink:0;background:#fff;border-top:1px solid #EBEDF0;padding:8px 16px 28px;display:flex;align-items:center;gap:8px;}
    .ch-in{flex:1;height:40px;background:#F4F5F7;border:none;border-radius:20px;padding:0 16px;font-size:14px;font-family:inherit;outline:none;color:#111827;}
    .ch-snd{width:40px;height:40px;border-radius:50%;background:#FF7A00;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

    /* Next steps */
    .steps-card{margin:0 16px 16px;background:#fff;border:1px solid #EBEDF0;border-radius:12px;overflow:hidden;}
    .steps-title{font-size:14px;font-weight:700;color:#111827;padding:14px 16px;border-bottom:1px solid #F0F1F3;}
    .next-step{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F4F5F7;}
    .next-step:last-child{border-bottom:none;}
    .ns-num{width:24px;height:24px;border-radius:50%;background:#FF7A00;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .ns-text{font-size:13px;color:#374151;line-height:1.5;}

    /* Bottom */
    .bottom-cta{flex-shrink:0;padding:12px 20px 28px;background:#F8FAFC;border-top:1px solid #EBEDF0;display:flex;flex-direction:column;gap:8px;}
    .btn-p{width:100%;height:56px;background:#FF7A00;color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:0 4px 14px rgba(255,122,0,.3);}
    .btn-p:active{filter:brightness(.88);}
    .btn-g{width:100%;height:48px;background:#fff;color:#374151;border:1.5px solid #EBEDF0;border-radius:14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}

    /* Confetti */
    .confetti-wrap{position:absolute;top:0;left:0;width:100%;height:200px;pointer-events:none;overflow:hidden;}
    .conf{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear both;}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(200px) rotate(720deg);opacity:0;}}
  </style>
</head>
<body>
<div class="ps">
  <div class="phone" id="phone" style="position:relative;">
    <div class="sb">
      <div class="di"></div>
      <span class="sb-t">9:41</span>
      <div class="sb-i">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#111827"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="4.5" y="4" width="3" height="8" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#111827" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="11" r="1" fill="#111827" stroke="none"/><path d="M5.5 8c1.4-1.4 3.6-1.4 5 0"/><path d="M3 5.5c2.8-2.8 7.2-2.8 10 0"/><path d="M.5 3C4.6-1 11.4-1 15.5 3"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#111827" stroke-opacity=".3"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#111827"/><path d="M24 4.5v4a2 2 0 000-4z" fill="#111827" fill-opacity=".4"/></svg>
      </div>
    </div>

    <!-- Confetti layer -->
    <div class="confetti-wrap" id="confetti"></div>

    <!-- Success Hero -->
    <div class="success-hero">
      <div class="check-circle">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <path d="M8 18l7 7 13-13" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="success-title">선택 완료!</div>
      <div class="success-sub" id="successSub">이준영 훈련사와 함께<br>훈련을 시작할 준비가 됐어요 🎉</div>
    </div>

    <div class="content">

      <!-- Trainer card -->
      <div class="trainer-card">
        <div class="trainer-card-top">
          <div class="trainer-avatar" id="avatarText">이</div>
          <div class="trainer-name-w">
            <div class="t-name" id="trainerName">이준영 훈련사</div>
            <div class="t-title">행동교정 전문 · 서울 마포구</div>
            <div class="t-rating-row">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B301"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B301"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B301"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B301"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5B301"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              <span>4.9 · 리뷰 127개</span>
            </div>
          </div>
        </div>
        <div class="trainer-card-body">
          <div class="info-row">
            <span class="info-label">훈련 방법</span>
            <span class="info-val">방문 훈련</span>
          </div>
          <div class="info-row">
            <span class="info-label">훈련 기간</span>
            <span class="info-val">4주 · 주 2회</span>
          </div>
          <div class="info-row">
            <span class="info-label">1회 비용</span>
            <span class="info-val info-orange">55,000원</span>
          </div>
          <div class="info-row">
            <span class="info-label">총 예상 비용</span>
            <span class="info-val info-orange">440,000원</span>
          </div>
        </div>
      </div>

      <!-- Next steps -->
      <div class="steps-card">
        <div class="steps-title">다음 단계</div>
        <div class="next-step">
          <div class="ns-num">1</div>
          <div class="ns-text">훈련사가 24시간 내 연락드려요</div>
        </div>
        <div class="next-step">
          <div class="ns-num">2</div>
          <div class="ns-text">첫 방문 일정 최종 확정</div>
        </div>
        <div class="next-step">
          <div class="ns-num">3</div>
          <div class="ns-text">훈련 시작 전 1:1 상담 진행</div>
        </div>
        <div class="next-step">
          <div class="ns-num">4</div>
          <div class="ns-text">훈련 시작 🎉</div>
        </div>
      </div>

    </div>

    <!-- Chat screen -->
    <div class="chat-screen" id="chatScreen">
      <div class="ch-nav">
        <div class="ch-back" onclick="closeChat()">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"><path d="M8.5 1.5L1.5 8.5l7 7"/></svg>
        </div>
        <div class="ch-av" id="chAv">이</div>
        <div style="flex:1">
          <div class="ch-nm" id="chNm">이준영 훈련사</div>
          <div class="ch-st">● 온라인</div>
        </div>
      </div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-bar">
        <input class="ch-in" id="chIn" type="text" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="ch-snd" onclick="sendMsg()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
        </button>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="bottom-cta">
      <button class="btn-p" onclick="openChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        채팅 시작하기
      </button>
      <a href="home.html" class="btn-g">홈으로 돌아가기</a>
    </div>
  </div>
</div>
<script>
  function scale(){const p=document.getElementById('phone');const s=Math.min(1,(window.innerWidth-32)/390,(window.innerHeight-32)/844);p.style.transform=`scale(${s})`;document.body.style.alignItems=s<1?'flex-start':'center';document.body.style.paddingTop=s<1?'16px':'0';}
  scale();window.addEventListener('resize',scale);

  // Load trainer name from localStorage
  const trainer = localStorage.getItem('pb_trainer') || '이준영';
  document.getElementById('trainerName').textContent = trainer + ' 훈련사';
  document.getElementById('avatarText').textContent = trainer[0];
  document.getElementById('successSub').textContent = `${trainer} 훈련사와 함께\n훈련을 시작할 준비가 됐어요 🎉`;

  // Adjust card gradient based on trainer
  const gradsMap = {'이준영':'linear-gradient(135deg,#667eea,#764ba2)','박민서':'linear-gradient(135deg,#f093fb,#f5576c)','최수진':'linear-gradient(135deg,#4facfe,#00f2fe)'};
  document.querySelector('.trainer-card-top').style.background = gradsMap[trainer] || gradsMap['이준영'];

  // Chat
  const trainerGrad = gradsMap[trainer] || gradsMap['이준영'];

  function openChat() {
    document.getElementById('chAv').style.background = trainerGrad;
    document.getElementById('chAv').textContent = trainer[0];
    document.getElementById('chNm').textContent = trainer + ' 훈련사';
    const now = new Date();
    const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('chatMsgs').innerHTML = `
      <div class="datelbl">오늘</div>
      <div class="msg">
        <div class="msg-av" style="background:${trainerGrad}">${trainer[0]}</div>
        <div><div class="bbl">안녕하세요! 훈련 의뢰 수락하게 되어 기뻐요 😊</div></div>
        <span class="mt">${time}</span>
      </div>
      <div class="msg">
        <div class="msg-av" style="background:${trainerGrad}">${trainer[0]}</div>
        <div><div class="bbl">첫 훈련 일정을 잡아볼게요. 편하신 날짜가 있으신가요?</div></div>
        <span class="mt">${time}</span>
      </div>`;
    document.getElementById('chatScreen').classList.add('show');
  }

  function closeChat() {
    document.getElementById('chatScreen').classList.remove('show');
  }

  function sendMsg() {
    const input = document.getElementById('chIn');
    const val = input.value.trim();
    if (!val) return;
    const now = new Date();
    const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
    const msgs = document.getElementById('chatMsgs');
    msgs.innerHTML += `<div class="msg me"><span class="mt">${time}</span><div class="bbl">${val}</div></div>`;
    input.value = '';
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => {
      const replies = ['네, 알겠습니다! 일정 확인 후 다시 연락드릴게요 😊', '좋아요! 그 날짜로 잡겠습니다.', '첫 훈련 전에 간단히 상담도 진행할게요.'];
      const r = replies[Math.floor(Math.random() * replies.length)];
      const now2 = new Date();
      const t2 = `${now2.getHours()}:${String(now2.getMinutes()).padStart(2,'0')}`;
      msgs.innerHTML += `<div class="msg"><div class="msg-av" style="background:${trainerGrad}">${trainer[0]}</div><div><div class="bbl">${r}</div></div><span class="mt">${t2}</span></div>`;
      msgs.scrollTop = msgs.scrollHeight;
    }, 800);
  }

  // Confetti
  const colors = ['#FF7A00','#FF9A3D','#FFF4EC','#FFD93D','#FF6B6B','#6BCB77'];
  const wrap = document.getElementById('confetti');
  for(let i=0;i<30;i++){
    const el=document.createElement('div');
    el.className='conf';
    el.style.left=Math.random()*100+'%';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.width=(6+Math.random()*6)+'px';
    el.style.height=(6+Math.random()*6)+'px';
    el.style.animationDuration=(.8+Math.random()*.8)+'s';
    el.style.animationDelay=(Math.random()*.6)+'s';
    el.style.borderRadius=Math.random()>.5?'50%':'2px';
    wrap.appendChild(el);
  }
</script>
</body>
</html>
